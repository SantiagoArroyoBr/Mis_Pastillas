<style>
:root{--bg:#FBF6EA;--card:#fff;--navy:#14284B;--ink:#1B1B1B;--green:#1F7A3E;--amber:#B86E00;--red:#B3261E;--line:#E4DCC8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.4 Nunito,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 16px 14px;border-radius:0 0 28px 28px}
h1{margin:0;font-size:28px;font-weight:900}
main{max-width:560px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;min-height:56px;border:0;border-radius:16px;background:rgba(255,255,255,.15);color:#fff;font:800 19px Nunito,sans-serif;padding:6px 10px}
.tab[aria-selected=true]{background:#fff;color:var(--navy)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--navy);color:#fff;font:800 19px Nunito,sans-serif;text-decoration:none;padding:10px 14px;text-align:center;cursor:pointer}
.btn.cal{background:#0B6E75}

.soon{background:#fff;border:3px solid var(--navy);border-radius:20px;padding:14px;margin:16px 0}

.card{background:var(--card);border-radius:22px;border-left:12px solid var(--c);box-shadow:0 3px 12px rgba(20,40,75,.12);padding:16px;margin:16px 0}
.card.green{--c:var(--green)}.card.amber{--c:var(--amber)}.card.red{--c:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.modes{display:flex;gap:8px;margin-top:12px}
.mbtn{flex:1;min-width:0;min-height:56px;border:0;border-radius:16px;background:rgba(255,255,255,.15);color:#fff;font:800 16px Nunito,sans-serif;padding:6px 4px}
.mbtn[aria-selected=true]{background:#fff;color:var(--navy)}

.card.gray{--c:#8a8a8a}

details{margin:6px 0 10px}
summary{font-weight:800;min-height:48px;display:flex;align-items:center;cursor:pointer;color:var(--navy)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:2px solid var(--line)}
.btn.vbtn{width:auto;min-width:112px}
.card.blue{--c:var(--navy)}
.amtv{font-weight:900;color:var(--navy);white-space:nowrap}
.pbar{display:flex;align-items:center;gap:8px;margin:12px 0}
.pbar .btn{width:auto;min-width:104px}
.prange{flex:1;text-align:center}
.nurses{margin:6px 0 8px}
.nlist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.nchip{min-height:44px;padding:4px 14px;border:0;border-radius:22px;color:#fff;font:800 16px Nunito,sans-serif}
.nchip.add{background:#fff;color:var(--navy);border:2px dashed var(--navy)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 6px}
.calhead b{text-transform:capitalize;font-size:19px;color:var(--navy)}
.calhead .btn{width:auto;min-width:56px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wh{text-align:center;font-weight:800;font-size:14px;color:#555}
.cell{min-width:0;min-height:62px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;font:700 14px Nunito,sans-serif;color:var(--ink);text-align:left;overflow:hidden;cursor:pointer}

.todo.red{border-left-color:var(--red)}
.todo.amber{border-left-color:var(--amber)}
.todo.ok{border-left-color:var(--green)}
.btn.tbtn{width:auto;min-width:96px}
.psels{display:flex;gap:6px;margin:8px 0}
.psel{flex:1;min-height:48px;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);font:800 16px Nunito,sans-serif;padding:4px}

</style>

<body>
<header>
  <h1>💊 Mis pastillas <small style="font-size:13px;font-weight:700;opacity:.7">v5 · aviso 2 días</small></h1>
  <div class="modes" id="modes"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <button class="ren" id="ren">Cambiar nombre de esta persona</button>
</header>
<main>
  <section id="paysoon"></section>
  <div id="medsView">
  <section id="soon"></section>
  <button class="btn ghost small share" id="share">📲 Compartir resumen por WhatsApp</button>
  <section id="list"></section>
  <button class="btn add" id="add">+ Agregar medicina</button>
  </div>
  <div id="homeView" hidden></div>
  <div id="payView" hidden></div>
  <div class="row backup">
    <button class="btn ghost small" id="exp">⬇️ Exportar respaldo</button>
    <button class="btn ghost small" id="imp">⬆️ Restaurar respaldo</button>
  </div>
  <input type="file" id="impFile" accept="application/json" hidden>
</main>
<dialog id="dlg"></dialog>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
const $=s=>document.querySelector(s);

// Convierte medicinas del formato viejo (dose/times/schedule) al nuevo (cons = lista de consumos)
const NPAL=['#C92A2A','#1864AB','#2B8A3E','#862E9C','#A61E4D','#0B7285','#B45309','#5F3DC4'];
const NPALN=['Rojo','Azul','Verde','Morado','Rosa','Turquesa','Naranja','Índigo'];
function migrate(d){
  (d.p||[]).forEach(p=>{
    if(!Array.isArray(p.meds))p.meds=[];
    p.meds.forEach(m=>{
      if(!Array.isArray(m.cons)){
        m.cons=[{dose:+m.dose||1,times:(Array.isArray(m.times)&&m.times.length)?m.times:['08:00'],schedule:m.schedule||{type:'daily'}}];
        delete m.dose;delete m.times;delete m.schedule;
      }
    });
  });
  if(!d.pay||typeof d.pay!=='object'||Array.isArray(d.pay))d.pay={};
  const z=d.pay;
  if(Array.isArray(z.w)){ // formato anterior: un pago por paciente
    const w0=z.w.find(x=>x&&x.who);
    if(w0&&!z.who){z.who=w0.who;z.day=w0.day;z.note=w0.note||'';z.paid=w0.paid||''}
    if(!Array.isArray(z.nurses))z.nurses=[];
    if(!z.v||typeof z.v!=='object'||Array.isArray(z.v))z.v={};
    z.w.forEach((w,i)=>{
      if(!w||!w.v)return;
      Object.keys(w.v).forEach(k=>{
        const n=w.v[k];if(!n||typeof n!=='string')return;
        (z.v[k]=z.v[k]||{})[i]=[{n,s:'full'}];
        z.nurses[i]=Array.isArray(z.nurses[i])?z.nurses[i]:[];
        if(!z.nurses[i].includes(n))z.nurses[i].push(n);
      });
    });
    delete z.w;
  }
  if(typeof z.who!=='string')z.who='';
  z.day=+z.day;if(!(z.day>=0&&z.day<=6))z.day=5;
  if(typeof z.note!=='string')z.note='';
  if(typeof z.paid!=='string')z.paid='';
  if(Array.isArray(z.shifts))z.shifts=z.shifts.filter(x=>x&&x.id!==undefined&&x.id!=='').map(x=>({id:String(x.id),n:String(x.n||'Turno'),a:(x.a===null||x.a===undefined||x.a===''||!isFinite(+x.a))?null:+x.a}));
  if(!Array.isArray(z.shifts)||!z.shifts.length)z.shifts=[{id:'full',n:'Turno completo',a:null},{id:'half',n:'Medio turno',a:null}];
  if(!Array.isArray(z.nurses))z.nurses=[];
  z.nurses=z.nurses.map(a=>Array.isArray(a)?a.map((x,k)=>{
    if(typeof x==='string'&&x)return{n:x,c:NPAL[k%NPAL.length]};
    if(x&&typeof x.n==='string'&&x.n)return{n:x.n,c:NPAL.includes(x.c)?x.c:NPAL[k%NPAL.length]};
    return null;
  }).filter(Boolean):[]);
  if(!z.v||typeof z.v!=='object'||Array.isArray(z.v))z.v={};
  if(!['home','meds','pay'].includes(d.mode))d.mode='home';
  return d;
}
let S=(()=>{try{const r=localStorage.getItem('pastillas-v1');if(r)return migrate(JSON.parse(r))}catch(e){}return{sel:0,last:'',p:[{name:'Persona 1',meds:[]},{name:'Persona 2',meds:[]}]}})();
migrate(S);
const save=()=>{try{localStorage.setItem('pastillas-v1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseTimes(txt){
  const out=[];
  for(const t of txt.split(/[,;]+/)){
    const m=t.trim().match(/^(\d{1,2})(?::(\d{2}))?$/);
    if(!m)return null;
    const h=+m[1],mi=+(m[2]||0);
    if(h>23||mi>59)return null;
    out.push(String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'));
  }
  return [...new Set(out)].sort();
}
const at=(d,t)=>{const[h,m]=t.split(':').map(Number);const x=new Date(d);x.setHours(h,m,0,0);return x.getTime()};

// ---- Frecuencia ----
function dayMatches(sch,d){
  if(!sch||sch.type==='daily')return true;
  if(sch.type==='weekdays')return (sch.days||[]).includes(d.getDay());
  if(sch.type==='interval'){
    const start=new Date(sch.start||Date.now());start.setHours(0,0,0,0);
    const cur=new Date(d);cur.setHours(0,0,0,0);
    const diff=Math.round((cur-start)/86400000);
    return diff>=0 && diff%Math.max(1,sch.n||1)===0;
  }
  return true;
}
const WD_SHORT=['dom','lun','mar','mié','jue','vie','sáb'];
function schedText(sch){
  if(!sch||sch.type==='daily')return'todos los días';
  if(sch.type==='weekdays'){
    const d=(sch.days||[]).slice().sort();
    return d.length?d.map(i=>WD_SHORT[i]).join(', '):'todos los días';
  }
  if(sch.type==='interval')return'cada '+(sch.n||1)+' días';
  return'todos los días';
}

// ---- Todas las tomas de TODOS los consumos entre a y b, en orden ----
function evs(m,a,b){
  const o=[];
  for(const c of m.cons){
    const d=new Date(a);d.setHours(0,0,0,0);
    while(d.getTime()<=b){
      if(dayMatches(c.schedule,d))for(const t of c.times){const x=at(d,t);if(x>a&&x<=b)o.push({t:x,d:c.dose})}
      d.setDate(d.getDate()+1);
    }
  }
  return o.sort((x,y)=>x.t-y.t);
}
function calc(m,now=Date.now()){
  const used=evs(m,m.t0,now).reduce((s,e)=>s+e.d,0);
  const rem=Math.max(0,+(m.base-used).toFixed(2));
  let stock=rem,left=0,end=null;
  for(const e of evs(m,now,now+1000*864e5)){
    if(stock+1e-9<e.d)break;
    stock=+(stock-e.d).toFixed(2);left++;end=e.t;
  }
  const WARN=2*864e5,URGENT=1*864e5;
  const buy=end?Math.max(now,end-WARN):now;
  const st=(!end||end<=now+URGENT)?'red':end<=now+WARN?'amber':'green';
  const days=end?Math.max(0,Math.ceil((end-now)/864e5)):0;
  return{rem,left,end,buy,st,days,now:buy<=now+3600e3};
}
const fmt=ms=>new Date(ms).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
const num=n=>String(n).replace('.',',');
function consText(m){
  const one=m.cons.length===1;
  return m.cons.map(c=>(one?'':'• ')+'Toma '+num(c.dose)+' pastilla'+(c.dose==1?'':'s')+', '+schedText(c.schedule)+', a las '+c.times.join(', ')).join('<br>');
}

function calUrl(title,buyMs,details){
  let d=new Date(buyMs);
  if(buyMs<=Date.now()+3600e3){d=new Date();if(d.getHours()<9){d.setHours(9,0,0,0)}else{d=new Date(Date.now()+15*60e3)}}
  else d.setHours(9,0,0,0);
  const e=new Date(d.getTime()+30*60e3);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+f(d)+'/'+f(e)+'&details='+encodeURIComponent(details);
}
const LBL={green:['✓','Bien'],amber:['!','Comprar pronto'],red:['✕','Urgente']};

// ================= PAGOS E INICIO (solo recordatorios; no se paga desde la app) =================
// Un solo pago semanal a la jefa. Los enfermeros (con color) se crean en Pagos y se asignan a días en Inicio.
const WD_LONG=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PLBL={green:['✓','Bien'],amber:['!','Pagar pronto'],red:['✕','Hoy toca pagar'],paid:['✓','Pagado']};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
const sd=d=>WD_SHORT[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()];
const cuando=dd=>dd===0?'hoy':dd===1?'mañana':'en '+dd+' días';
let showT=0,payOff=0,calM=0,homeP=-1;
const amtOn=()=>Date.now()<showT;
const A=n=>amtOn()?money(n):'••••';
const shName=id=>{const x=S.pay.shifts.find(y=>y.id===id);return x?x.n:'(turno eliminado)'};
const shIdx=id=>S.pay.shifts.findIndex(y=>y.id===id);
const ents=(ds,i)=>{const a=(S.pay.v[ds]||{})[i];return Array.isArray(a)?a.filter(e=>e&&typeof e.n==='string'):[]};
const nurList=i=>S.pay.nurses[i]||[];
const nurColor=(i,n)=>{const x=nurList(i).find(y=>y.n===n);return x?x.c:'#8A8A8A'};
const nextColor=i=>{const used=new Set(nurList(i).map(x=>x.c));return NPAL.find(c=>!used.has(c))||NPAL[nurList(i).length%NPAL.length]};

// Fecha fija: el próximo pago es el siguiente día elegido, se haya pagado o no
function payInfo(now=new Date()){
  const z=S.pay;
  const t=new Date(now);t.setHours(0,0,0,0);
  const dd=(z.day-t.getDay()+7)%7;
  const due=new Date(t);due.setDate(due.getDate()+dd);
  const ds=ymd(due);
  const paid=z.paid===ds;
  const st=paid?'green':dd===0?'red':dd<=2?'amber':'green';
  return{dd,due,ds,paid,st};
}

// Semana de pago: desde el día siguiente al último pago hasta hoy (si hoy es día de pago, los 7 días que terminan hoy)
function periodDays(off){
  const t=new Date();t.setHours(0,0,0,0);
  const dd=(t.getDay()-S.pay.day+7)%7;
  const end=new Date(t);let len;
  if(off===0){len=dd===0?7:dd}
  else{end.setDate(end.getDate()-dd-7*(off-1)-(dd===0?7:0));len=7}
  const out=[];
  for(let k=0;k<len;k++){const d=new Date(end);d.setDate(d.getDate()-k);out.push(d)}
  return out; // del más reciente al más antiguo
}

function summary(i,days){
  const by=new Map();let total=0,count=0;
  days.forEach(d=>ents(ymd(d),i).forEach(e=>{
    let o=by.get(e.n);if(!o){o={n:e.n,c:new Map(),amt:0};by.set(e.n,o)}
    o.c.set(e.s,(o.c.get(e.s)||0)+1);count++;
    const x=S.pay.shifts.find(y=>y.id===e.s);if(x&&x.a!=null){o.amt+=x.a;total+=x.a}
  }));
  return{rows:[...by.values()].sort((a,b)=>a.n.localeCompare(b.n,'es')),total,count};
}

// Fechas de compra y de agotamiento de las pastillas de una persona (con las dosis tomadas tal como están indicadas)
function pillEv(i){
  const map={};
  const add=(ds,k,n)=>{(map[ds]=map[ds]||{buy:[],end:[]})[k].push(n)};
  const p=S.p[i];if(!p)return map;
  const today=ymd(new Date());
  p.meds.forEach(m=>{
    const c=calc(m);
    if(!c.end){add(today,'buy',m.name);add(today,'end',m.name);return}
    add(ymd(new Date(c.buy)),'buy',m.name);
    add(ymd(new Date(c.end)),'end',m.name);
  });
  return map;
}

// Aviso 2 días antes, con repetición semanal. No incluye nombres ni montos.
function payCalUrl(){
  const inf=payInfo();
  const st=new Date(inf.due);st.setDate(st.getDate()-2);st.setHours(9,0,0,0);
  while(st.getTime()<Date.now())st.setDate(st.getDate()+7);
  const en=new Date(st.getTime()+30*60e3);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Pago de enfermería en 2 días')+'&dates='+f(st)+'/'+f(en)+'&details='+encodeURIComponent('Recordatorio semanal. El pago es el '+WD_LONG[S.pay.day]+'.')+'&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY');
}

function payNotice(){

function calHTML(i){
  const first=new Date();first.setHours(0,0,0,0);first.setDate(1);first.setMonth(first.getMonth()+calM);
  const y=first.getFullYear(),m=first.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7; // semana desde el lunes
  const t0=new Date();t0.setHours(0,0,0,0);const todayS=ymd(t0);
  const title=first.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const pe=pillEv(i);
  let cells=['L','M','M','J','V','S','D'].map(x=>`<div class="wh">${x}</div>`).join('');
  for(let k=0;k<lead;k++)cells+='<div></div>';
  for(let dn=1;dn<=dim;dn++){
    const d=new Date(y,m,dn),ds=ymd(d),es=ents(ds,i),ev=pe[ds];
    const mk=[S.pay.who&&d.getDay()===S.pay.day?'💵':'',ev&&ev.buy.length?'🛒':'',ev&&ev.end.length?'⚠️':''].join('');
    const chips=es.slice(0,3).map(e=>`<span class="chip${shIdx(e.s)>0?' lite':''}" style="background:${nurColor(i,e.n)}">${esc(e.n)}</span>`).join('')+(es.length>3?`<span class="hint">+${es.length-3}</span>`:'');
    const lab=dn+' de '+title+(mk?' ('+[S.pay.who&&d.getDay()===S.pay.day?'día de pago':'',ev&&ev.buy.length?'comprar pastillas':'',ev&&ev.end.length?'se acaban pastillas':''].filter(Boolean).join(', ')+')':'')+(es.length?': '+es.map(e=>e.n+' ('+shName(e.s)+')').join(', '):'');
    cells+=`<button class="cell${ds===todayS?' today':''}${ev&&ev.end.length?' end':ev&&ev.buy.length?' buy':''}" data-pa="day" data-i="${i}" data-d="${ds}" aria-label="${esc(lab)}"><span class="dn">${dn}</span>${mk?`<span class="mk">${mk}</span>`:''}${chips}</button>`;
  }
  return `<div class="calhead"><button class="btn ghost small" data-pa="cm" data-s="-1" aria-label="Mes anterior"${calM<=-12?' disabled':''}>◀</button><b>${title}</b><button class="btn ghost small" data-pa="cm" data-s="1" aria-label="Mes siguiente"${calM>=6?' disabled':''}>▶</button></div>
    <div class="calgrid">${cells}</div>
    <p class="hint">🛒 comprar pastillas · ⚠️ se acaban · 💵 día de pago · los colores son los enfermeros${S.pay.shifts.length>1?' (sólido: '+esc(S.pay.shifts[0].n)+', claro: otros turnos)':''}. Toca un día para ver el detalle y asignar.</p>`;
}

function shiftsForm(){
  form('Tipos de turno y montos',[],()=>{
    const out=[];
    for(const r of document.querySelectorAll('#shrows .trow')){
      const [ni,ai]=r.querySelectorAll('input');
      const n=ni.value.trim();if(!n)continue;
      let a=null;
      if(ai.value.trim()!==''){a=pos(ai.value);if(!(a>=0))return'Revisa los montos: deben ser números (o déjalos vacíos).'}
      if(out.some(x=>x.n.toLowerCase()===n.toLowerCase()))return'Hay dos turnos con el mismo nombre: '+n+'.';
      out.push({id:r.dataset.id||('s'+Math.random().toString(36).slice(2,8)),n:n.slice(0,40),a});
    }
    if(!out.length)return'Deja al menos un tipo de turno.';
    S.pay.shifts=out;save();render();
  },'Guardar');
  const box=document.createElement('div');box.id='shrows';
  const addRow=x=>{
    const r=document.createElement('div');r.className='trow';r.dataset.id=x.id||'';
    r.innerHTML='<input type="text" aria-label="Nombre del turno" placeholder="Ej. Turno completo"><input type="number" inputmode="decimal" min="0" step="any" aria-label="Monto (opcional)" placeholder="Monto">'+'<button type="button" aria-label="Quitar turno">×</button>';
    const [ni,ai]=r.querySelectorAll('input');ni.value=x.n||'';ai.value=x.a==null?'':x.a;
    r.querySelector('button').onclick=()=>{if(box.children.length>1)r.remove()};
    box.appendChild(r);
  };
  S.pay.shifts.forEach(addRow);
  const h2=dlg.querySelector('h2');
  h2.insertAdjacentElement('afterend',box);
  box.insertAdjacentHTML('beforebegin','<p class="hint">Los montos son opcionales y se mantienen ocultos en pantalla.</p>');
  box.insertAdjacentHTML('afterend','<button type="button" class="btn ghost small" id="addsh" style="margin-top:6px">+ Agregar tipo de turno</button>');
  $('#addsh').onclick=()=>addRow({});
}

function nurseForm(i,k){
  const p=S.p[i],cur=k===undefined?null:nurList(i)[k];
  if(k!==undefined&&!cur)return;
  form(cur?'Editar a '+esc(cur.n):'Agregar enfermero/a de '+esc(p.name),[
    {id:'nn',l:'Nombre',t:'text',ph:'Ej. María',v:cur?cur.n:''},
    {id:'nc',l:'Color en el calendario',t:'color',v:cur?cur.c:nextColor(i)}
  ],v=>{
    const n=v.nn.trim().slice(0,40);
    if(!n)return'Escribe el nombre.';
    if(!NPAL.includes(v.nc))return'Elige un color.';
    if(nurList(i).some((x,j)=>j!==k&&x.n.toLowerCase()===n.toLowerCase()))return'Ya hay un enfermero/a con ese nombre.';
    if(cur){
      if(cur.n!==n){
        Object.keys(S.pay.v).forEach(dk=>{const a=S.pay.v[dk][i];if(Array.isArray(a))a.forEach(e=>{if(e.n===cur.n)e.n=n})});
        cur.n=n;
      }
      cur.c=v.nc;
    }else{
      const L=(S.pay.nurses[i]=Array.isArray(S.pay.nurses[i])?S.pay.nurses[i]:[]);
      L.push({n,c:v.nc});
    }
    save();render();
  },'Guardar');
  if(cur)$('#nc').insertAdjacentHTML('afterend',`<button type="button" class="link" data-pa="nrm" data-i="${i}" data-k="${k}">Quitar de la lista</button>`);
}

function renForm(i){

// Detalle de un día: pastillas, pago y enfermeros (los enfermeros se crean en Pagos)
function dayForm(i,ds){
  const p=S.p[i];if(!p)return;
  const shifts=S.pay.shifts,nurses=nurList(i);
  const [y,m,d]=ds.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const label=dt.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const ev=pillEv(i)[ds];
  let info='';
  if(S.pay.who&&dt.getDay()===S.pay.day)info+=`<p class="info">💵 Día de pago: se le paga a <b>${esc(S.pay.who)}</b>.</p>`;
  if(ev&&ev.buy.length)info+=`<p class="info">🛒 Comprar: <b>${ev.buy.map(x=>esc(x)).join(', ')}</b></p>`;
  if(ev&&ev.end.length)info+=`<p class="info">⚠️ Se acaban: <b>${ev.end.map(x=>esc(x)).join(', ')}</b> (última toma completa ese día)</p>`;
  const cur=ents(ds,i);
  const list=cur.length?'<div>'+cur.map((e,k)=>`<div class="vrow"><div><span class="dot" style="background:${nurColor(i,e.n)}"></span><b>${esc(e.n)}</b> · ${esc(shName(e.s))}</div><button type="button" class="link" data-pa="rm" data-i="${i}" data-d="${ds}" data-k="${k}">Quitar</button></div>`).join('')+'</div>':'';
  const title=label+' · '+esc(p.name);
  if(!nurses.length){
    form(title,[],()=>{S.mode='pay';save();render();window.scrollTo(0,0)},'Ir a Pagos');
    dlg.querySelector('h2').insertAdjacentHTML('afterend',info+list+`<p class="hint">Aún no hay enfermeros para ${esc(p.name)}. Agrégalos en la pestaña Pagos y luego asígnalos aquí.</p>`);
    return;
  }
  const wdn=WD_LONG[dt.getDay()];
  const once='Solo este día',weekly='Cada '+wdn+' hasta fin de mes';
  form(title,[
    {id:'nm',l:'Asignar enfermero o enfermera',t:'text',ph:'Toca un nombre',v:'',presets:nurses.map(x=>({l:esc(x.n),v:esc(x.n)}))},
    {id:'sh',l:'Tipo de turno',t:'text',v:shifts[0].n,presets:shifts.map(x=>({l:esc(x.n),v:esc(x.n)}))},
    {id:'rp',l:'¿Repetir?',t:'text',v:once,presets:[{l:once,v:once},{l:weekly,v:weekly}]}
  ],v=>{
    const n=v.nm.trim();
    if(!n)return;
    if(!nurses.some(x=>x.n===n))return'Elige un enfermero/a de los botones. Para agregar uno nuevo, ve a Pagos.';
    const x=shifts.find(y2=>y2.n===v.sh.trim());
    if(!x)return'Elige el tipo de turno con los botones.';
    const dates=[ds];
    if(v.rp.trim()===weekly){for(let k=1;;k++){const n2=new Date(y,m-1,d+7*k);if(n2.getMonth()!==m-1)break;dates.push(ymd(n2))}}
    dates.forEach(dk=>{
      const day=(S.pay.v[dk]=S.pay.v[dk]||{});
      const a=(day[i]=Array.isArray(day[i])?day[i]:[]);
      if(!a.some(e=>e.n===n&&e.s===x.id))a.push({n,s:x.id});
    });
    const cut=ymd(new Date(Date.now()-400*864e5));
    Object.keys(S.pay.v).forEach(k=>{if(k<cut)delete S.pay.v[k]});
    save();render();
  },'Asignar');
  $('#nm').readOnly=true;$('#sh').readOnly=true;$('#rp').readOnly=true;
  dlg.querySelectorAll('.pbtn[data-set="nm"]').forEach(b=>{b.classList.add('col');b.style.background=nurColor(i,b.dataset.val)});
  dlg.querySelector('h2').insertAdjacentHTML('afterend',info+list);
}

function payAction(t){
  const pa=t.dataset.pa,i=+t.dataset.i,ds=t.dataset.d;
  if(pa==='gopay'){S.mode='pay';save();render();window.scrollTo(0,0)}
  else if(pa==='gomed'){S.mode='meds';S.sel=Math.min(i,S.p.length-1);save();render();window.scrollTo(0,0)}
  else if(pa==='hp'){homeP=i;render()}
  else if(pa==='cfg')payForm();
  else if(pa==='shifts')shiftsForm();
  else if(pa==='paid'){const inf=payInfo();S.pay.paid=inf.paid?'':inf.ds;save();render()}
  else if(pa==='show'){
    if(amtOn())showT=0;
    else{showT=Date.now()+8000;setTimeout(()=>{if(Date.now()>=showT-50){showT=0;render()}},8100)}
    render();
  }
  else if(pa==='off'){payOff=Math.max(0,Math.min(8,payOff+(+t.dataset.s)));render()}
  else if(pa==='cm'){calM=Math.max(-12,Math.min(6,calM+(+t.dataset.s)));render()}
  else if(pa==='day')dayForm(i,ds);
  else if(pa==='nadd')nurseForm(i);
  else if(pa==='nedit')nurseForm(i,+t.dataset.k);
  else if(pa==='nrm'){
    const nm=nurList(i)[+t.dataset.k];if(!nm)return;
    form('¿Quitar a '+esc(nm.n)+' de la lista?',[],()=>{nurList(i).splice(+t.dataset.k,1);save();render()},'Sí, quitar');
  }
  else if(pa==='ren')renForm(i);
  else if(pa==='rm'){
    const a=S.pay.v[ds]&&S.pay.v[ds][i];
    if(Array.isArray(a)){
      a.splice(+t.dataset.k,1);
      if(!a.length)delete S.pay.v[ds][i];
      if(!Object.keys(S.pay.v[ds]).length)delete S.pay.v[ds];
      save();render();setTimeout(()=>dayForm(i,ds),30);
    }
  }
}

function summaryText(P){
  if(!P.meds.length)return'No hay medicinas registradas.';
  return P.meds.map(m=>{
    const c=calc(m);
    const when=c.st==='red'?'¡urgente, comprar ya!':c.st==='amber'?'comprar antes del '+fmt(c.buy):'bien por ahora';
    return `• ${m.name}: quedan ${num(c.rem)} pastillas (${when})`;
  }).join('\n');
}

// Aviso emergente una vez al día (si están activados), desde cualquier pestaña. Sin montos.
function notifyDaily(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const k=new Date().toDateString();
  if(S.last===k)return;
  const parts=[],names=[];
  S.p.forEach(p=>p.meds.forEach(m=>{if(calc(m).st!=='green')names.push(m.name)}));
  if(names.length)parts.push('Hay que comprar: '+names.join(', '));
  if(S.pay.who){const inf=payInfo();if(!inf.paid&&inf.dd<=2)parts.push('Pago de enfermería: '+cuando(inf.dd))}
  if(!parts.length)return;
  S.last=k;save();
  try{new Notification('Mis pastillas',{body:parts.join(' · ')})}catch(e){}
}

function render(){
  const P=S.p[S.sel];
  const md=S.mode;
  notifyDaily();
  $('#modes').innerHTML=[['home','🏠 Inicio'],['meds','💊 Pastillas'],['pay','💵 Pagos']].map(([m,l])=>`<button class="mbtn" aria-selected="${md===m}" data-m="${m}">${l}</button>`).join('');
  $('#tabs').hidden=md!=='meds';$('#ren').hidden=md!=='meds';$('#medsView').hidden=md!=='meds';
  $('#homeView').hidden=md!=='home';$('#payView').hidden=md!=='pay';
  if(md==='pay'){$('#paysoon').innerHTML='';renderPay();return}
  if(md==='home'){$('#paysoon').innerHTML='';renderHome();return}
  $('#paysoon').innerHTML=payNotice();
  $('#tabs').innerHTML=S.p.map((p,i)=>`<button class="tab" role="tab" aria-selected="${i===S.sel}" data-i="${i}">${esc(p.name)}</button>`).join('');
  const items=[];
  S.p.forEach(p=>p.meds.forEach(m=>{const c=calc(m);if(c.st!=='green')items.push({p:p.name,m,c})}));
  items.sort((a,b)=>a.c.buy-b.c.buy);
  let h;
  if(!items.length){h=`<div class="soon ok">✓ Todo en orden: por ahora no hay que comprar nada.</div>`}
  else{
    const det=items.map(i=>`${i.m.name} (${i.p}): quedan ${num(i.c.rem)} pastillas`).join('\n');
    h=`<div class="soon"><h2>🛒 Comprar pronto</h2><ul>${items.map(i=>`<li><b>${esc(i.m.name)}</b> (${esc(i.p)}): ${i.c.st==='red'?'urgente':'antes del '+fmt(i.c.buy)}</li>`).join('')}</ul>
    <a class="btn cal" target="_blank" rel="noopener" href="${calUrl('Comprar medicinas',items[0].c.buy,det)}">📅 Avisarme en Calendario</a>
    ${('Notification' in window&&Notification.permission==='default')?'<button class="btn ghost small" style="margin-top:8px" id="notif">🔔 Activar avisos en pantalla</button>':''}</div>`;
  }
  $('#soon').innerHTML=h;
  $('#list').innerHTML=P.meds.length?P.meds.map((m,i)=>{
    const c=calc(m),[ic,tx]=LBL[c.st];
    return `<article class="card ${c.st}">
      <div class="top"><h3 class="name">${esc(m.name)}</h3><span class="badge">${ic} ${tx}</span></div>
      <p class="big">${num(c.rem)} <small>pastillas</small></p>
      <p class="info">Alcanzan para <b>${c.days} ${c.days===1?'día':'días'}</b> (${c.left} tomas).${c.end?`<br>Última toma completa: <b>${fmt(c.end)}</b>.`:'<br><b>Ya no alcanza para una toma.</b>'}<br>Comprar: <b>${c.now?'hoy':'antes del '+fmt(c.buy)}</b>.<br><br>${consText(m)}</p>
      <button class="btn" data-a="box" data-i="${i}">Compré más</button>
      <div class="row"><button class="btn ghost small" data-a="edit" data-i="${i}">Editar</button>
      <button class="btn ghost small" data-a="fix" data-i="${i}">Corregir cantidad</button></div>
      <a class="btn cal small" target="_blank" rel="noopener" href="${calUrl('Comprar '+m.name+' (aprox.)',c.buy,'Quedan '+num(c.rem)+' pastillas de '+m.name+' ('+P.name+').')}">📅 Avisarme</a>
      <button class="link" data-a="del" data-i="${i}">Borrar esta medicina</button>
    </article>`}).join(''):`<p class="empty">Aún no hay medicinas para ${esc(P.name)}.<br>Toca “Agregar medicina”.</p>`;
}

const dlg=$('#dlg');
dlg.addEventListener('click',e=>{
  const b=e.target.closest('.pbtn');if(!b)return;
  const inp=document.getElementById(b.dataset.set);if(!inp)return;
  inp.value=b.dataset.val;
  [...document.querySelectorAll('.pbtn[data-set="'+b.dataset.set+'"]')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
});

function fieldHTML(f){
  if(f.t==='head')return `<div class="chead"><h3>Consumo ${f.k+1}</h3>${f.multi?`<button type="button" class="link rmc" data-k="${f.k}">Quitar</button>`:''}</div>`;
  if(f.t==='wday')return `<label>${f.l}</label><div class="wdays" id="${f.id}" data-v="${f.v===undefined||f.v===null?'':f.v}"></div>`;
  if(f.t==='color')return `<label>${f.l}</label><div class="swatches" id="${f.id}" data-v="${f.v||''}"></div>`;
  if(f.t==='times')return `<label>${f.l}</label><div id="${f.id}"></div><button type="button" class="btn ghost small" id="addt-${f.id}" style="margin-top:6px">+ Otra hora</button>`;
  if(f.t==='schedule')return `<label>${f.l}</label>
    <div class="schtabs" role="tablist" id="${f.id}-tabs">
      <button type="button" class="stab" data-v="daily">Diario</button>
      <button type="button" class="stab" data-v="weekdays">Días fijos</button>
      <button type="button" class="stab" data-v="interval">Cada X días</button>
    </div>
    <div class="schpane" id="${f.id}-daily"><p class="hint">Se toma todos los días.</p></div>
    <div class="schpane" id="${f.id}-weekdays" hidden><div class="wdays" id="${f.id}-wdbtns"></div></div>
    <div class="schpane" id="${f.id}-interval" hidden>
      <label for="${f.id}-n">¿Cada cuántos días? (1 = diario, 2 = un día sí y uno no...)</label>
      <input id="${f.id}-n" type="number" min="1" step="1" value="${(f.v&&f.v.n)||2}">
    </div>`;
  return `<label for="${f.id}">${f.l}</label><input id="${f.id}" ${f.t==='text'?'':'inputmode="decimal"'} type="${f.t==='text'?'text':'number'}" step="any" min="0" value="${esc(f.v??'')}" placeholder="${esc(f.ph||'')}">${f.presets?`<div class="presets">${f.presets.map(p=>`<button type="button" class="pbtn" data-set="${f.id}" data-val="${p.v}" aria-pressed="${String(f.v)===p.v}">${p.l}</button>`).join('')}</div>`:''}${f.h?`<p class="hint">${f.h}</p>`:''}`;
}

function form(title,fields,ok,btn='Guardar'){
  dlg.innerHTML=`<form method="dialog" id="f"><h2>${title}</h2>${fields.map(fieldHTML).join('')}<p class="err" id="err"></p>
  <div class="stack"><button class="btn" type="submit">${btn}</button><button class="btn ghost" type="button" id="no">Cancelar</button></div></form>`;
  $('#no').onclick=()=>dlg.close();

  fields.filter(f=>f.t==='times').forEach(tf=>{
    const box=$('#'+tf.id);
    const addRow=(v='')=>{const d=document.createElement('div');d.className='trow';d.innerHTML='<input type="time" aria-label="Hora de la toma"><button type="button" aria-label="Quitar hora">×</button>';d.querySelector('input').value=v;d.querySelector('button').onclick=()=>{if(box.children.length>1)d.remove()};box.appendChild(d)};
    (tf.v||['08:00']).forEach(addRow);
    $('#addt-'+tf.id).onclick=()=>addRow('');
  });

  fields.filter(f=>f.t==='schedule').forEach(sf=>{
    const init=sf.v||{type:'daily'};
    const tabs=$('#'+sf.id+'-tabs');
    const panes={daily:$('#'+sf.id+'-daily'),weekdays:$('#'+sf.id+'-weekdays'),interval:$('#'+sf.id+'-interval')};
    const setTab=v=>{[...tabs.children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));Object.entries(panes).forEach(([k,el])=>el.hidden=k!==v);tabs.dataset.cur=v};
    tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setTab(b.dataset.v)});
    setTab(init.type||'daily');
    const wdbox=$('#'+sf.id+'-wdbtns');
    const selDays=new Set(init.days||[]);
    WD_SHORT.forEach((lbl,i)=>{
      const b=document.createElement('button');b.type='button';b.className='wdaybtn';b.textContent=lbl[0].toUpperCase();b.setAttribute('aria-pressed',String(selDays.has(i)));
      b.onclick=()=>{if(selDays.has(i))selDays.delete(i);else selDays.add(i);b.setAttribute('aria-pressed',String(selDays.has(i)))};
      wdbox.appendChild(b);
    });
    sf._selDays=selDays;
    sf._start=init.start||Date.now();
  });

  fields.filter(f=>f.t==='wday').forEach(wf=>{
    const box=$('#'+wf.id);const cur=box.dataset.v;
    [1,2,3,4,5,6,0].forEach(i=>{
      const b=document.createElement('button');b.type='button';b.className='wdaybtn w';b.dataset.i=String(i);b.textContent=WD_SHORT[i];
      b.setAttribute('aria-pressed',String(String(i)===cur));
      b.onclick=()=>{box.dataset.v=String(i);[...box.children].forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.i===String(i))))};
      box.appendChild(b);
    });
  });

  fields.filter(f=>f.t==='color').forEach(cf=>{
    const box=$('#'+cf.id);
    NPAL.forEach((c,k)=>{
      const b=document.createElement('button');b.type='button';b.className='swbtn';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label',NPALN[k]);
      b.setAttribute('aria-pressed',String(c===box.dataset.v));
      b.onclick=()=>{box.dataset.v=c;[...box.children].forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.c===c)))};
      box.appendChild(b);
    });
  });

  // Lee todos los campos del formulario actual
  const collect=()=>{
    const v={};
    fields.forEach(f=>{
      if(f.t==='head')return;
      if(f.t==='wday'||f.t==='color')v[f.id]=$('#'+f.id).dataset.v||'';
      else if(f.t==='times')v[f.id]=[...$('#'+f.id).querySelectorAll('input')].map(i=>i.value).filter(Boolean).join(',');
      else if(f.t==='schedule'){
        const cur=$('#'+f.id+'-tabs').dataset.cur;
        if(cur==='weekdays')v[f.id]={type:'weekdays',days:[...f._selDays].sort()};
        else if(cur==='interval')v[f.id]={type:'interval',n:Math.max(1,parseInt($('#'+f.id+'-n').value)||2),start:f._start};
        else v[f.id]={type:'daily'};
      }
      else v[f.id]=$('#'+f.id).value;
    });
    return v;
  };
  dlg._collect=collect;

  $('#f').onsubmit=e=>{
    e.preventDefault();
    const r=ok(collect());
    if(r){$('#err').textContent=r}else dlg.close();
  };
  if(!dlg.open)dlg.showModal();
}
function result(m){
  const c=calc(m);
  dlg.innerHTML=`<h2>¡Listo!</h2><p>${esc(m.name)}: ahora hay <b>${num(c.rem)} pastillas</b>.<br>Conviene comprar de nuevo <b>${c.now?'hoy':'antes del '+fmt(c.buy)}</b>.</p>
  <div class="stack"><a class="btn cal" target="_blank" rel="noopener" href="${calUrl('Comprar '+m.name+' (aprox.)',c.buy,'Quedan '+num(c.rem)+' pastillas de '+m.name+'.')}">📅 Avisarme en Calendario</a><button class="btn ghost" id="cl">Cerrar</button></div>`;
  $('#cl').onclick=()=>dlg.close();if(!dlg.open)dlg.showModal();
}
const pos=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN};

// ---- Formulario de medicina con varios consumos (agregar y editar) ----
const PRE=[{l:'¼',v:'0.25'},{l:'½',v:'0.5'},{l:'¾',v:'0.75'},{l:'1',v:'1'},{l:'1½',v:'1.5'},{l:'2',v:'2'}];
const newCons=()=>({dose:'1',schedule:{type:'daily'},times:['08:00']});

// D = {name, q, cons:[{dose,schedule,times}]} ; onSave(name, cantidad, consumosLimpios)
function medForm(title,D,onSave,btn){
  const f=[
    {id:'n',l:'Nombre de la medicina',t:'text',ph:'Ej. Losartán',v:D.name},
    {id:'q',l:'Pastillas que hay ahora',ph:'Ej. 30',v:D.q}
  ];
  D.cons.forEach((c,k)=>{
    f.push({t:'head',id:'c'+k,k,multi:D.cons.length>1},
      {id:'d'+k,l:'Pastillas por toma',v:c.dose,presets:PRE},
      {id:'sch'+k,l:'¿Cada cuándo se toma?',t:'schedule',v:c.schedule},
      {id:'h'+k,l:'Horas de las tomas',t:'times',v:c.times});
  });
  form(title,f,v=>{
    if(!v.n.trim())return'Escribe el nombre de la medicina.';
    const q=pos(v.q);
    if(!(q>=0)||v.q==='')return'Escribe cuántas pastillas hay.';
    const cons=[];
    for(let k=0;k<D.cons.length;k++){
      const d=pos(v['d'+k]),h=parseTimes(v['h'+k]),s=v['sch'+k],tag='Consumo '+(k+1)+': ';
      if(!(d>0))return tag+'escribe cuántas pastillas se toman cada vez (puede ser ½, ¼, etc.).';
      if(s.type==='weekdays'&&(!s.days||!s.days.length))return tag+'elige al menos un día de la semana.';
      if(!h||!h.length)return tag+(h===null?'revisa el formato de las horas (ej. 08:00).':'agrega al menos una hora.');
      cons.push({dose:d,times:h,schedule:s});
    }
    onSave(v.n.trim(),q,cons);
  },btn);

  // Lee lo que ya escribió el usuario para no perderlo al agregar/quitar consumos
  const read=()=>{
    const v=dlg._collect();
    return{name:v.n,q:v.q,cons:D.cons.map((_,k)=>({dose:v['d'+k],schedule:v['sch'+k],times:parseTimes(v['h'+k])||['08:00']}))};
  };
  $('#err').insertAdjacentHTML('beforebegin','<button type="button" class="btn ghost" id="addc" style="margin-top:16px">+ Agregar otro consumo</button>');
  $('#addc').onclick=()=>{const r=read();r.cons.push(newCons());medForm(title,r,onSave,btn)};
  dlg.querySelectorAll('.rmc').forEach(b=>b.onclick=()=>{const r=read();r.cons.splice(+b.dataset.k,1);medForm(title,r,onSave,btn)});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const P=S.p[S.sel];
  if(t.classList.contains('tab')){S.sel=+t.dataset.i;save();render()}
  else if(t.classList.contains('mbtn')){S.mode=['home','meds','pay'].includes(t.dataset.m)?t.dataset.m:'home';save();render();window.scrollTo(0,0)}
  else if(t.id==='notif'){Notification.requestPermission().then(render)}
  else if(t.id==='ren'){form('Nombre de la persona',[{id:'n',l:'Nombre',t:'text',v:P.name}],v=>{if(!v.n.trim())return'Escribe un nombre.';P.name=v.n.trim();save();render()})}
  else if(t.id==='share'){
    const txt='Resumen de medicinas de '+P.name+':\n\n'+summaryText(P);
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  }
  else if(t.id==='exp'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='pastillas-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  else if(t.id==='imp'){$('#impFile').click()}
  else if(t.id==='add'){
    medForm('Agregar medicina',{name:'',q:'',cons:[newCons()]},(name,q,cons)=>{
      P.meds.push({name,base:q,cons,t0:Date.now()});save();render();
    },'Agregar');
  }
  else if(t.dataset.pa){payAction(t)}
  else if(t.dataset.a){
    const m=P.meds[+t.dataset.i];
    if(t.dataset.a==='box'){
      form('Compré: '+esc(m.name),[
        {id:'boxes',l:'¿Cuántas cajas/empaques compraste?',v:'1'},
        {id:'q',l:'¿Cuántas pastillas trae cada una?',ph:'Ej. 30'}
      ],v=>{
        const boxes=pos(v.boxes),q=pos(v.q);
        if(!(boxes>0))return'Escribe cuántas cajas compraste.';
        if(!(q>0))return'Escribe cuántas pastillas trae cada caja.';
        const c=calc(m);m.base=c.rem+boxes*q;m.t0=Date.now();save();render();setTimeout(()=>result(m),50);
      },'Sumar pastillas');
    }else if(t.dataset.a==='edit'){
      const c=calc(m);
      medForm('Editar: '+esc(m.name),{name:m.name,q:c.rem,cons:JSON.parse(JSON.stringify(m.cons))},(name,q,cons)=>{
        m.name=name;m.base=q;m.cons=cons;m.t0=Date.now();save();render();
      },'Guardar cambios');
    }else if(t.dataset.a==='fix'){
      form('Corregir cantidad: '+esc(m.name),[{id:'q',l:'Cuente las pastillas que hay y escriba el número',v:calc(m).rem}],v=>{
        const q=pos(v.q);if(!(q>=0)||v.q==='')return'Escribe un número.';
        m.base=q;m.t0=Date.now();save();render();setTimeout(()=>result(m),50);
      },'Corregir');
    }else if(t.dataset.a==='del'){
      form('¿Borrar '+esc(m.name)+'?',[],()=>{P.meds.splice(+t.dataset.i,1);save();render()},'Sí, borrar');
    }
  }
});

$('#impFile').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{data=migrate(JSON.parse(reader.result));if(!data||!Array.isArray(data.p))throw 0}
    catch(err){
      dlg.innerHTML='<h2>Archivo no válido</h2><p>Ese archivo no parece un respaldo de Mis pastillas.</p><div class="stack"><button class="btn ghost" id="cl2">Cerrar</button></div>';
      $('#cl2').onclick=()=>dlg.close();dlg.showModal();return;
    }
    form('¿Restaurar este respaldo?',[],()=>{
      S=data;if(typeof S.sel!=='number'||!S.p[S.sel])S.sel=0;if(typeof S.last!=='string')S.last='';
      save();render();
    },'Sí, restaurar (reemplaza todo)');
  };
  reader.readAsText(file);
  e.target.value='';
});

render();
setInterval(()=>{if(!dlg.open)render()},60000);
</script>
</body>
</html>
