<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cuidados</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14284B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>🗓️ Cuidados <small style="font-size:13px;font-weight:700;opacity:.7">v9</small></h1>
  <div class="modes" id="modes"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <button class="ren" id="ren">Cambiar nombre de esta persona</button>
</header>
<main>
  <section id="persistenceWarning" class="soon warning" role="alert" hidden></section>
  <section id="paysoon"></section>
  <div id="medsView">
  <section id="soon"></section>
  <section id="spend"></section>
  <button class="btn ghost small share" id="share">📲 Compartir resumen por WhatsApp</button>
  <section id="list"></section>
  <button class="btn add" id="add">+ Agregar medicina</button>
  <button class="btn add" id="addsup">+ Agregar insumo (pañales, gasas…)</button>
  </div>
  <div id="homeView" hidden></div>
  <div id="payView" hidden></div>
  <div class="row backup">
    <button class="btn ghost small" id="exp">⬇️ Exportar respaldo</button>
    <button class="btn ghost small" id="imp">⬆️ Restaurar respaldo</button>
  </div>
  <input type="file" id="impFile" accept="application/json" hidden>
</main>
<dialog id="dlg"></dialog>
<script src="js/utils.js"></script>
<script src="app.js"></script>
</body>
</html>
