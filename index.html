<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acompaña</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#245565">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Acompaña</h1>
  <p class="tagline">Cuidar también es organizar.</p>
  <div class="modes" id="modes"></div>
  <section class="patient-picker" id="patientPicker" aria-label="Gestión de fichas" hidden>
    <div class="tabs" role="group" aria-label="Fichas de pacientes" id="tabs"></div>
    <div class="patient-actions" id="patientActions">
      <button class="patient-control" id="addPatient">Añadir ficha</button>
      <button class="patient-control" id="showArchived" aria-pressed="false">Consultar archivadas</button>
    </div>
    <div class="patient-actions" id="activePatientActions" role="group" aria-label="Acciones de la ficha seleccionada">
      <button class="patient-control" id="ren">Editar ficha activa</button>
      <button class="patient-control" id="archivePatient">Archivar ficha activa</button>
      <details class="patient-options"><summary>Retirar ficha</summary><button class="patient-control" id="retirePatient">Revisar retiro de ficha</button></details>
    </div>
  </section>
</header>
<main>
  <section id="persistenceWarning" class="soon warning" role="alert" hidden></section>
  <section id="paysoon"></section>
  <div id="medsView">
  <section id="soon"></section>
  <section id="spend"></section>
  <button class="btn ghost small share" id="share">📲 Compartir resumen por WhatsApp</button>
  <section id="list"></section>
  <button class="btn add" id="add">+ Agregar medicina</button>
  <button class="btn add" id="addsup">+ Agregar insumo (pañales, gasas…)</button>
  </div>
  <div id="homeView" hidden></div>
  <div id="payView" hidden>
    <div id="accountView"></div>
    <div id="staffView"></div>
  </div>
  <p id="accountStatus" class="account-status" role="status"></p>
  <div class="row backup">
    <button class="btn ghost small" id="exp" aria-describedby="backupHelp">⬇️ Exportar respaldo</button>
    <button class="btn ghost small" id="imp" aria-describedby="restoreHelp">⬆️ Restaurar respaldo</button>
  </div>
  <p class="hint" id="backupHelp">La descarga crea una copia privada JSON y no borra lo guardado. Incluye fichas, medicinas, citas, turnos y pagos.</p>
  <p class="hint" id="restoreHelp">Puedes revisar el archivo antes de confirmar el reemplazo de los datos guardados en este navegador.</p>
  <p class="hint" id="backupStatus" role="status" aria-live="polite" hidden></p>
  <input type="file" id="impFile" accept="application/json" hidden>
</main>
<dialog id="dlg" aria-labelledby="formTitle"></dialog>
<script src="compatibility.js"></script>
<script src="domain.js"></script>
<script src="sharing.js"></script>
<script src="payments.js"></script>
<script src="inventory.js"></script>
<script src="care-ui.js"></script>
<script src="forms.js"></script>
<script src="appointments.js"></script>
<script src="app.js"></script>
</body>
</html>
